<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pragati Spices</title>

<style>
body{margin:0;font-family:Arial;background:#f3f4f6}
.header{background:#c62828;color:white;padding:15px;text-align:center;font-size:22px}
.container{padding:15px;max-width:1000px;margin:auto}
.card{background:white;padding:15px;margin-bottom:15px;border-radius:10px}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:6px;border:1px solid #ccc}
button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:8px;margin-top:10px}
.output{background:#f9fafb;padding:10px;border-radius:6px;white-space:pre-wrap}
</style>
</head>

<body>

<div class="header">🌶️ Pragati Spices</div>

<div class="container">

<div class="card">
<h3>USD Rate</h3>
<input id="usd" placeholder="Enter USD Rate">
</div>

<div class="card">
<h3>Add Product</h3>
<select id="product">
<option value="">Select Product</option>
<option value="coriander">Coriander Seeds</option>
<option value="cumin">Cumin Seeds</option>
<option value="fennel">Fennel Seeds</option>
<option value="turmeric">Turmeric Fingers</option>
<option value="desiccated">Desiccated Coconut</option>
<option value="ginger">Dry Ginger</option>
</select>
<button onclick="addProduct()">Add Product</button>
</div>

<div id="forms"></div>

<div class="card">
<button onclick="generate()">Generate Output</button>
</div>

<div class="card">
<h3>Email Output</h3>
<div id="email" class="output"></div>
</div>

<div class="card">
<h3>WhatsApp Output</h3>
<div id="wa" class="output"></div>
</div>

<div class="card">
<h3>📊 Cost Breakdown</h3>
<div id="breakdown" class="output"></div>
</div>

</div>

<script>

let products = {
coriander:["Eagle","Scooter","Single Parrot","Double Parrot"],
cumin:["Singapore 99%","Europe"],
fennel:["Singapore","Semi-Europe","Europe"],
turmeric:["Single Polish","Double Polish"],
desiccated:["Fine Grade","Medium Grade","Flakes"],
ginger:["Deluxe Maharashtra","Deluxe Karnataka","Super Deluxe Karnataka"]
};

let data = JSON.parse(localStorage.getItem("data") || "[]");

// ---------- SAVE ----------
function save(){
localStorage.setItem("data", JSON.stringify(data));
render();
}

// ---------- UI ----------
function addProduct(){
let type=document.getElementById("product").value;
if(!type)return;

data.push({
type,
name:type.toUpperCase(),
values:{},
profit:(type==="coriander"?0:3),
custom:0
});

save();
}

function render(){
let html="";
data.forEach((p,i)=>{
html+=`<div class="card">
<h3>${p.name}</h3>

<input placeholder="Profit %" value="${p.profit}"
onchange="data[${i}].profit=this.value;save()">

<input placeholder="Custom ₹/kg" value="${p.custom}"
onchange="data[${i}].custom=this.value;save()">`;

products[p.type].forEach(q=>{
html+=`<input placeholder="${q} ₹/kg"
value="${p.values[q]||""}"
onchange="data[${i}].values['${q}']=this.value;save()">`;
});

html+="</div>";
});

document.getElementById("forms").innerHTML=html;
}

// ---------- CALC ----------
function roundToFive(n){
let r=n%10;
if(r<=2.5)return Math.floor(n/10)*10;
if(r<=7.5)return Math.floor(n/10)*10+5;
return Math.ceil(n/10)*10;
}

function calc(price,custom,profit,usd){

price = Number(price);
custom = Number(custom);
profit = Number(profit);
usd = Number(usd);

let profitAmt = price * (profit/100);
let finalINR = price + profitAmt + custom;
let usdVal = roundToFive((finalINR * 1000)/usd);

let profitPerMT = profitAmt * 1000;
let suggested = roundToFive(usdVal * 1.02);

return {
cost:price,
profit:profitAmt,
custom:custom,
final:finalINR,
usd:usdVal,
profitPerMT:profitPerMT,
suggested:suggested
};
}

// ---------- GENERATE ----------
function generate(){

let usd=document.getElementById("usd").value;
if(!usd)return alert("Enter USD rate");

let email = `Subject: Daily Price Update – Indian Spices (FOB Mumbai/Mundra Port)

Dear Sir/Madam,

Greetings from Pragati Spices.

Please find below our latest price update:

`;

let wa = `🌶️ *Pragati Spices – Daily Update* 🌶️

📢 *Today's Rate Update*

`;

let breakdown = "";

data.forEach(p=>{

email += `${p.name}\n----------------------------------------\n`;
wa += `*${p.name}*\n`;

products[p.type].forEach(q=>{

let price = p.values[q];
let r = price ? calc(price,p.custom,p.profit,usd) : null;

if(r){
email += `${q.padEnd(25)} : ${r.usd} USD/MT\n`;
wa += `${q} - ${r.usd} USD/MT\n`;

breakdown += `${p.name} - ${q}\n`;
breakdown += `Cost: ₹${r.cost}\n`;
breakdown += `Profit: ₹${r.profit.toFixed(2)}\n`;
breakdown += `Custom: ₹${r.custom}\n`;
breakdown += `Final: ₹${r.final.toFixed(2)}\n`;
breakdown += `USD: ${r.usd}\n`;
breakdown += `Profit/MT: ₹${r.profitPerMT}\n`;
breakdown += `Suggested: ${r.suggested} USD/MT\n`;
breakdown += `----------------------\n`;

}else{
email += `${q.padEnd(25)} : -\n`;
wa += `${q} - -\n`;
}

});

email += `\n`;
wa += `\n`;

});

email += `Looking forward to your valued inquiry.

Best regards,  
Pragati Spices  
📞 +91 98985 31381  
📧 info@pragatispices.com | sales@pragatispices.com  
🌐 www.pragatispices.com`;

wa += `📦 FOB Mumbai/Mundra Port  
📞 +91 98985 31381  
📧 info@pragatispices.com | sales@pragatispices.com  
🌐 www.pragatispices.com`;

document.getElementById("email").innerText = email;
document.getElementById("wa").innerText = wa;
document.getElementById("breakdown").innerText = breakdown;
}

// INIT
render();

</script>

</body>
</html>
